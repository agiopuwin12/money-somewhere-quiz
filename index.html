function nextQuestion(){clearInterval(interval);idx++;if(idx>=order.length){round++;setupOrder(false)}render()}
function beep(freq,dur){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.type="sine";g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.045,audioCtx.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}catch(e){}}
function togglePause(){paused=!paused;if(paused){$("pauseBtn").textContent="▶  RESUME";clearInterval(interval)}else{$("pauseBtn").textContent="Ⅱ  PAUSE";if(revealed){setTimeout(nextQuestion,500)}else startTimer()}}
$("pauseBtn").addEventListener("click",()=>{if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}togglePause()});
$("nextBtn").addEventListener("click",()=>{if(!revealed)revealAnswer();else nextQuestion()});
$("restartBtn").addEventListener("click",()=>{clearInterval(interval);setupOrder();render()});
$("duration").addEventListener("change",()=>{if(!revealed){full=remaining=Number($("duration").value);drawTimer();if(!paused)startTimer()}});
$("musicToggle").addEventListener("change",e=>{musicOn=e.target.checked;if(musicOn)startMusic();else stopMusic()});
$("soundToggle").addEventListener("change",e=>soundOn=e.target.checked);
function startMusic(){if(musicTimer||!musicOn)return;let notes=[196,247,294,247,220,262,330,262],n=0;musicTimer=setInterval(()=>{if(!musicOn)return;softNote(notes[n++%notes.length])},650)}
function softNote(freq){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="triangle";o.frequency.value=freq;g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.008,audioCtx.currentTime+.08);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.45);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.46)}catch(e){}}
function stopMusic(){clearInterval(musicTimer);musicTimer=null}
document.addEventListener("pointerdown",()=>{if(musicOn)startMusic()},{once:true});
setupOrder();render();
</script>
