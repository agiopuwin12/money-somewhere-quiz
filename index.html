function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function stop(){if(interval){clearInterval(interval);interval=null;} }
function unlockAudio(){
  if(!soundEnabled)return;
  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtx)return;
  if(!audioContext)audioContext=new AudioCtx();
  if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});
}
function beep(freq,volume,duration,delay=0){
  if(!soundEnabled||!audioContext||audioContext.state!=='running')return;
  const start=audioContext.currentTime+delay;
  const oscillator=audioContext.createOscillator();
  const gain=audioContext.createGain();
  oscillator.type='sine';oscillator.frequency.setValueAtTime(freq,start);
  gain.gain.setValueAtTime(0.0001,start);
  gain.gain.exponentialRampToValueAtTime(volume,start+0.008);
  gain.gain.exponentialRampToValueAtTime(0.0001,start+duration);
  oscillator.connect(gain);gain.connect(audioContext.destination);
  oscillator.start(start);oscillator.stop(start+duration+0.02);
}
function countdownSound(secondsLeft){
  if(secondsLeft>10||secondsLeft<1)return;
  if(secondsLeft>5){
    // Gentle, low tick while there is still time.
    beep(520,0.045,0.07);
  }else{
    // Higher, sharper double-beep during the final five seconds.
    beep(880,0.085,0.09);
    beep(1040,0.075,0.09,0.14);
  }
}
function cancelAutoNext(){if(advanceTimeout){clearTimeout(advanceTimeout);advanceTimeout=null;}}
function startTimer(){stop();interval=setInterval(()=>{if(paused||answered)return;remaining=Math.max(0,remaining-1);drawTimer();countdownSound(remaining);if(remaining===0){stop();reveal(-1);}},1000);}
function drawTimer(){
  $('timeNum').textContent=remaining;
  const pct=total?remaining/total:0;
  $('progress').style.strokeDashoffset=339.3*(1-pct);
  $('progress').style.stroke=remaining<=5?'#e34b4b':remaining<=10?'#e5ad35':'#18b866';
  $('timeLabel').textContent=remaining<=5?'HURRY UP!':'TIME LEFT';
}
function render(){
  answered=false;paused=false;total=Number($('duration').value);remaining=total;
  $('roundLabel').textContent=`ROUND ${Math.floor(index/20)+1} • QUESTION ${String(index%20+1).padStart(3,'0')}`;
  $('scoreLabel').textContent=`SCORE: ${score}`;
  const item=bank[index%bank.length];$('question').textContent=item.q;
  const options=item.opts.map((v,i)=>({v,correct:i===item.correct,letter:letters[i]}));
  $('answers').innerHTML='';
  options.forEach((o,i)=>{
    const btn=document.createElement('button');btn.className='answer';
    const badge=document.createElement('span');badge.className='letter';badge.textContent=o.letter;
    const text=document.createElement('span');text.textContent=o.v;
    btn.append(badge,text);btn.addEventListener('click',()=>{if(!answered&&!paused)reveal(i);});
    $('answers').appendChild(btn);
  });
  $('pauseBtn').textContent='Ⅱ PAUSE';$('status').textContent='';
  drawTimer();startTimer();
}
function reveal(choice){
  if(answered)return;answered=true;stop();cancelAutoNext();
  const item=bank[index%bank.length];const buttons=[...$('answers').children];
  buttons.forEach((b,i)=>{b.disabled=true;if(i===item.correct)b.classList.add('correct');else if(i===choice)b.classList.add('wrong');});
  if(choice===item.correct){score++;$('status').textContent='CORRECT! WELL DONE';}
  else $('status').textContent=choice<0?'TIME UP!':'NOT QUITE — THE CORRECT ANSWER IS HIGHLIGHTED';
  $('scoreLabel').textContent=`SCORE: ${score}`;
  $('timeLabel').textContent='ANSWER REVEALED';
  // Briefly show the correct answer, then continue automatically.
  advanceTimeout=setTimeout(()=>{advanceTimeout=null;next();},3000);
}
function next(){cancelAutoNext();index++;if(index>=bank.length)index=0;render();}
$('pauseBtn').addEventListener('click',()=>{
  if(answered)return;paused=!paused;
  $('pauseBtn').textContent=paused?'▶ RESUME':'Ⅱ PAUSE';
  $('status').textContent=paused?'GAME PAUSED':'';
});
$('nextBtn').addEventListener('click',next);
$('restartBtn').addEventListener('click',()=>{stop();cancelAutoNext();index=0;score=0;shuffle(bank);render();});
$('duration').addEventListener('change',()=>{unlockAudio();if(!answered){total=Number($('duration').value);remaining=total;drawTimer();startTimer();}});
$('soundBtn').addEventListener('click',()=>{
  soundEnabled=!soundEnabled;
  $('soundBtn').textContent=soundEnabled?'🔊 SOUND ON':'🔇 SOUND OFF';
  $('soundBtn').setAttribute('aria-pressed',String(soundEnabled));
  if(soundEnabled)unlockAudio();
});
// Mobile browsers require a user gesture before they allow countdown audio.
document.addEventListener('pointerdown',unlockAudio,{once:true});
document.addEventListener('keydown',unlockAudio,{once:true});
buildBank();shuffle(bank);render();
